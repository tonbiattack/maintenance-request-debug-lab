services:
  web:
    build: ./web
    ports: ["5173:5173"]
    environment: { VITE_API_URL: http://localhost:5000 }
    depends_on: [api]
  api:
    build: ./api
    ports: ["5000:5000"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: maintenance
      DATABASE_USER: maintenance
      DATABASE_PASSWORD: maintenance
    depends_on: [postgres]
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: maintenance, POSTGRES_USER: maintenance, POSTGRES_PASSWORD: maintenance }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U maintenance -d maintenance"], interval: 5s, timeout: 3s, retries: 20 }
